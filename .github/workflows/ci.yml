name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Check the app imports and starts headless
        run: |
          python -c "import app, core, server; print('imports ok')"
          python app.py --no-open --port 8799 &
          for _ in $(seq 1 40); do
            curl -s -o /dev/null "http://127.0.0.1:8799/" && break
            sleep 0.5
          done
          curl -sf -o /dev/null "http://127.0.0.1:8799/" || (echo "server did not start"; exit 1)
          echo "server responded"
